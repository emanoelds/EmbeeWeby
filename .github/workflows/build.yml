name: Build EmbeeWeby
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --draft --title "EmbeeWeby $tag" --generate-notes
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm exec electron-builder -- --publish never
      - name: Upload installers directly to private draft
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.AppImage dist/*.dmg dist/*.zip dist/*.blockmap dist/latest*.yml)
          test ${#files[@]} -gt 0
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Publish completed private release
        shell: bash
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
