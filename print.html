<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'"><title>Imprimir — EmbeeWeby</title><link rel="stylesheet" href="print.css"></head><body><header><div class="brand"><img src="assets/app-icon.png" alt=""><div><strong>Imprimir</strong><span>Prévia da página</span></div></div><div id="page-count">Preparando documento…</div></header><aside><div class="source"><span class="eyebrow">DOCUMENTO</span><strong id="source-title">Carregando página</strong></div><label>Destino<select id="destination"><option value="pdf">Salvar como PDF</option></select></label><div class="row"><label>Papel<select id="paper"><option>A4</option><option value="Letter">Carta</option><option value="Legal">Ofício</option></select></label><label>Orientação<select id="orientation"><option value="portrait">Retrato</option><option value="landscape">Paisagem</option></select></label></div><label>Páginas<input id="ranges" placeholder="Todas — ou 1, 3-5" autocomplete="off"></label><div class="row"><label>Escala (%)<input id="scale" type="number" min="25" max="200" value="100"></label><label>Cópias<input id="copies" type="number" min="1" max="99" value="1"></label></div><label>Margens<select id="margins"><option value="default">Padrão</option><option value="none">Sem margens</option></select></label><label class="check"><input id="background" type="checkbox" checked> Imprimir gráficos de fundo</label><label class="check"><input id="color" type="checkbox" checked> Impressão em cores</label><p id="printer-note"></p><p id="status" role="status">Detectando as páginas do documento…</p><footer><button id="cancel">Cancelar</button><button id="submit" disabled>Salvar PDF</button></footer></aside><div class="preview-label">PRÉVIA DO DOCUMENTO</div><script src="print-ui.js"></script></body></html>
